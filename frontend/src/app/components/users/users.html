<nav class="navbar navbar-dark bg-dark px-4 mb-4">
  <a class="navbar-brand" href="#">SmartWinnr Admin</a>
  <div>
    <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Back to Dashboard</a>
  </div>
</nav>

<div class="container">
  <h2 class="mb-4">User Management</h2>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="bg-light">
          <tr>
            <th class="ps-4">Name</th>
            <th>Email</th>
            <th>Role</th>
            <th class="text-end pe-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td class="ps-4 fw-bold">{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span class="badge" 
                [ngClass]="user.role === 'admin' ? 'bg-primary' : 'bg-secondary'">
                {{ user.role | titlecase }}
              </span>
            </td>
            <td class="text-end pe-4">
              <button 
                class="btn btn-sm btn-outline-danger" 
                (click)="deleteUser(user._id)"
                [disabled]="user.role === 'admin'">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
